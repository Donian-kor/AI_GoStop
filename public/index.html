<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고스톱</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="app">
  <!-- 입장 -->
  <section id="lobby" class="screen">
    <h1 class="logo">고스톱</h1>
    <p class="sub">가족끼리 함께 치는 고스톱</p>
    <div class="version-badge">버전 <b id="appVersion">{{GAME_VERSION}}</b></div>
    <input id="nameInput" type="text" placeholder="이름" maxlength="12" autocomplete="off">
    <div class="row">
      <select id="modeSelect">
        <option value="multi-3">3명 (가족과 함께)</option>
        <option value="multi-2">2인 맞고</option>
        <option value="multi-4">4인 광팔기</option>
        <option value="solo-2">혼자 · AI와 2인</option>
        <option value="solo-3">혼자 · AI와 3인</option>
      </select>
      <select id="diffSelect">
        <option value="easy">AI 쉬움</option>
        <option value="normal" selected>AI 보통</option>
        <option value="hard">AI 어려움</option>
        <option value="expert">AI 초고수</option>
      </select>
    </div>
    <div class="row">
      <button id="createBtn" class="primary">방 만들기</button>
      <button id="joinBtn">방 참가</button>
    </div>
    <div id="joinBox" class="hidden">
      <input id="codeInput" type="text" placeholder="방 코드" maxlength="6" autocapitalize="characters">
      <button id="joinGoBtn" class="primary">참가하기</button>
    </div>
    <p id="lobbyError" class="error"></p>
  </section>

  <!-- 방 -->
  <section id="room" class="screen hidden">
    <header class="topbar">
      <button id="codeChip" class="chip" title="방 코드 (눌러서 복사)">------</button>
      <div class="topbar-right">
        <span id="moneyChip" class="chip">0 P</span>
        <button id="bgmBtn" class="chip icon" title="배경음악">♪</button>
        <button id="muteBtn" class="chip icon" title="소리 끄기">🔊</button>
        <button id="leaveBtn" class="chip icon" title="방 나가기">✕</button>
      </div>
    </header>

    <div id="players" class="players"></div>

    <div id="settingsRow" class="settings-row hidden">
      <span class="settings-label">방 설정</span>
      <label>시간제한
        <select id="timeLimitSelect">
          <option value="off">없음</option>
          <option value="30">30초+5초</option>
          <option value="45">45초+5초</option>
          <option value="60">60초+10초</option>
        </select>
      </label>
      <label>점당 금액
        <input id="pointValueInput" type="number" min="1" max="100000" step="10" inputmode="numeric">
      </label>
    </div>

    <div id="scorePanel" class="score-panel"></div>

    <div class="table-field">
      <div id="tableWrap" class="table-wrap">
        <div id="deckStack" class="deck-stack"></div>
        <div id="table" class="table"></div>
        <p id="tableHint" class="hint"></p>
      </div>
    </div>

    <div id="promptBox" class="prompt hidden"></div>

    <div id="handWrap" class="hand-wrap">
      <div id="hand" class="hand"></div>
    </div>

    <footer class="bottombar">
      <span id="turnInfo" class="turn"></span>
      <span id="timer" class="timer"></span>
      <button id="startBtn" class="primary hidden">판 시작</button>
    </footer>

    <div id="toast" class="toast hidden"></div>
    <div id="overlay" class="overlay hidden"></div>
  </section>
</div>

<script src="fx.js?v=2"></script>
<script src="app.js?v=3"></script>
</body>
</html>
